name: CI

on: 
 push: 
  branches: [master]

jobs:
 build-and-push:
  runs-on: ubuntu-latest
  steps:
    - name: checkout-code
      uses: actions/checkout@v4

    - name: Docker setup [login]
      uses: docker/login-action@v4

      with: 
       username: ${{vars.DOCKERHUB_USERNAME}}
       password: ${{vars.DOCKERHUB_TOKEN}}

       

      


    -name: docker build

    
    
   
      
      
 
  

 
  
